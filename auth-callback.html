<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Preserve all query parameters when redirecting
        var currentUrl = window.location.href;
        var indexOfParams = currentUrl.indexOf('?');
        if (indexOfParams !== -1) {
            var params = currentUrl.slice(indexOfParams + 1); // Extract everything after '?'
            window.location.href = '/index.html?' + params;
        } else {
            window.location.href = '/index.html';
        }
    </script>
</head>
<body>
    <p>Redirecting to home page after successful login...</p>
    <noscript>
        If you are not redirected automatically, please <a href="/index.html">click here</a>.
    </noscript>
</body>
</html>
